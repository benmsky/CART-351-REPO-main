<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <title>Cloud Reading</title>
    </head>
    <body>
        <!-- the sky: p5.js draws the clouds on a canvas in here -->
        <div id="sky"></div>

        <!-- the grass you're lying in, along the bottom of the screen -->
        <div id="grass"></div>

        <!-- title in the corner -->
        <header id="title">
            <h1>Cloud Reading</h1>
            <p>what do you see?</p>
        </header>

        <!-- the box that opens next to a cloud when you click it -->
        <form id="reading" autocomplete="off">
            <label for="reading-input">what do you see?</label>
            <div class="row">
                <input id="reading-input" type="text" maxlength="40" placeholder="a dog, a ship, my grandma...">
                <button type="submit">tell the sky</button>
            </div>
        </form>

        <!-- p5.js library, then my scripts -->
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
        <script src="{{ url_for('static', filename='js/clouds.js') }}"></script>
        <script src="{{ url_for('static', filename='js/reading.js') }}"></script>
    </body>
</html>
